{% include base_path %}

<div class="{{ include.type | default: "list" }}__item">
  <article class="archive__item publication-entry" itemscope itemtype="http://schema.org/ScholarlyArticle">
    <p class="publication-title" itemprop="headline">
      {% if post.tag %}<span class="publication-tag">[{{ post.tag }}]</span>{% endif %}
      {{ post.title }}
    </p>

    {% if post.authors %}
      <p class="publication-authors">{{ post.authors }}</p>
    {% endif %}

    {% if post.venue %}
      <p class="publication-venue"><i>{{ post.venue }}</i>{% if post.year %}, {{ post.year }}{% endif %}.</p>
    {% endif %}

    {% if post.paperurl %}
      <p class="publication-links">[<a href="{{ post.paperurl }}">Paper</a>]</p>
    {% endif %}
  </article>
</div>
